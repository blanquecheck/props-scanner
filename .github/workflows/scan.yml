# Read-only props scanner on GitHub Actions (stopgap until the Raspberry Pi is set up).
#
# Runs every 5 minutes (GitHub's minimum) across the pregame windows. Schedules are UTC and
# cover both EST and EDT; `scanner auto` decides what to scan from the US-Eastern clock:
#   NBA nightly 4pm-midnight ET, NFL Sun 10am-9pm ET and Mon/Thu 6-9pm ET.
# Minutes are offset (:02, :07, ...) because GitHub delays runs more at the top of the hour.
#
# The repo is public, so the database is ENCRYPTED (AES-256, key in the DB_KEY secret) before it
# is saved to the `scanner-data` branch as a single force-pushed commit. Without DB_KEY the run
# refuses to save, so a plaintext database can never be published.
name: scan

on:
  schedule:
    - cron: "2-57/5 20-23 * * *"   # 3pm-6:59pm ET in winter / 4pm-7:59pm in summer
    - cron: "2-57/5 0-4 * * *"     # 7pm-11:59pm ET in winter / 8pm-12:59am in summer
    - cron: "2-57/5 14-19 * * 0"   # Sunday NFL 9am-2:59pm ET in winter / 10am-3:59pm in summer
  workflow_dispatch:
    inputs:
      force:
        description: "Sports to scan now regardless of the time window (e.g. nba or nba,nfl). Blank = auto."
        required: false
        default: ""

concurrency:
  group: scanner          # never two runs at once (they share the database)
  cancel-in-progress: false

permissions:
  contents: write         # only to push the encrypted database to the scanner-data branch

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      DB_KEY: ${{ secrets.DB_KEY }}
      DB_PATH: props.db
      CLOSE_LEAD_MIN: "7"    # runs are ~5 min apart and can start late, so open the close window a bit early
    steps:
      - name: Require the encryption key
        run: |
          if [ -z "$DB_KEY" ]; then
            echo "::error::DB_KEY secret is missing. Refusing to run so a plaintext database is never published."
            exit 1
          fi

      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -q -r requirements.txt

      - name: Restore database
        run: scripts/db_crypt.sh restore

      - name: Scan
        run: python -m scanner auto --force "${{ github.event.inputs.force }}"

      - name: Save database (encrypted)
        if: always() && hashFiles('props.db') != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/db_crypt.sh save
